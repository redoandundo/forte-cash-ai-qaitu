[project]
name = "fortebank-video-audit"
version = "0.1.0"
description = "Local video audit service prototype for the ForteBank Datathon case"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fortebank_audit"]
