# Fixed before outer evaluation; CPU-compatible export and <=4 GB training GPU.
seed: 42
model: r3d_18_kinetics
data:
  num_frames: 16
  image_size: 112
  window_sec: 6.0
  stride_sec: 2.0
  include_tail: true
training:
  epochs: 6
  batch_size: 1
  accumulation_steps: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  amp: true
  augmentation: true
  unfreeze_epoch: null
  unfreeze_blocks: 0
  loss_normalization: dataset_mean
