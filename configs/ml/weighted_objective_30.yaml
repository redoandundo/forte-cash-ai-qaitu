seed: 42
model: mobilenet_v3_small_temporal
data:
  num_frames: 4
  image_size: 160
  window_sec: 6.0
  stride_sec: 2.0
  include_tail: true
training:
  epochs: 30
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  augmentation: true
  unfreeze_epoch: null
  unfreeze_blocks: 0
  loss_normalization: dataset_mean
