seed: 42
model: mobilenet_v3_small_temporal_conv1d
data:
  num_frames: 8
  image_size: 160
  window_sec: 6.0
  stride_sec: 2.0
  include_tail: true
training:
  epochs: 6
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0003
  finetune_learning_rate: 0.00003
  weight_decay: 0.0001
  amp: true
  augmentation: true
  unfreeze_epoch: 4
  unfreeze_blocks: 2
