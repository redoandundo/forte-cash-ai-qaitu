seed: 42
task: binary_violation_detection
labels:
  0: no_violation
  1: violation
data:
  raw_root: data/raw/open
  clip_manifest: analysis/clip_manifest.json
  clip_seconds: 6.0
  frames: 4
  image_size: 160
  validation_fraction: 0.2
  negative_position: 0.5
training:
  epochs: 8
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  early_stopping_patience: 3
  decision_metric: macro_f1_then_auroc
  amp: true
augmentation:
  angle:
    degrees: 7
    translate: 0.06
    scale: [0.92, 1.08]
    perspective: 0.12
  lighting:
    brightness: 0.25
    contrast: 0.25
    gamma: [0.8, 1.2]
  compression:
    jpeg_quality: [35, 90]
models:
  simple:
    name: mobilenet_v3_small_temporal
    pretrained: true
    train_backbone: false
  x3d:
    name: x3d_xs
    pretrained: true
    train_backbone: false
export:
  format: onnx
  opset: 17
  input_name: video
  output_name: logits
  dynamic_batch: true
